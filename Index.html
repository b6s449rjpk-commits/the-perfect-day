<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background: linear-gradient(135deg, #FFF8F0, #F5F0FF);
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
 .card {
    background: white;
    padding: 40px;
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    text-align: center;
    width: 350px;
  }
 .dice {
    font-size: 100px;
    cursor: pointer;
    transition: transform 0.6s ease;
    user-select: none;
  }
 .dice.rolling {
    animation: roll 0.6s ease;
  }
  @keyframes roll {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(360deg) scale(1.2); }
    100% { transform: rotate(720deg) scale(1); }
  }
 .question {
    margin-top: 20px;
    font-size: 18px;
    color: #5A5A5A;
    min-height: 60px;
  }
  button {
    background: #FFD6E0;
    border: none;
    padding: 12px 24px;
    border-radius: 16px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
  }
</style>
</head>
<body>

<div class="card">
  <h2 style="color:#A78BFA;">Roll for a Question 🎲</h2>
  <div class="dice" id="dice">🎲</div>
  <div class="question" id="question">Click the dice!</div>
</div>

<script>
const questions = {
 1: ["What's your favorite memory from childhood?", "If you could have dinner with anyone, who?"],
 2: ["What's a skill you want to learn?", "Describe your dream vacation"],
 3: ["What's the best advice you've gotten?", "What makes you laugh the most?"],
 4: ["If you won the lottery, what would you do?", "What's your comfort food?"],
  5: ["What's a goal you're working on?", "Who inspires you?"],
 6: ["What's your favorite book/movie?", "If you could teleport anywhere right now?"]
};

const dice = document.getElementById('dice');
const questionBox = document.getElementById('question');

dice.addEventListener('click', () => {
  dice.classList.add('rolling');

  setTimeout(() => {
    const roll = Math.floor(Math.random() * 6) + 1;
    const diceFaces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
    dice.textContent = diceFaces[roll-1];

    const categoryQuestions = questions[roll];
    const randomQ = categoryQuestions[Math.floor(Math.random() * categoryQuestions.length)];
    questionBox.textContent = randomQ;

    dice.classList.remove('rolling');
  }, 600);
});
</script>

</body>
</html>
